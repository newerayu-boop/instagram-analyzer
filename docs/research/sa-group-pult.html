<title>Пульт SA GROUP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — glass sidebar of modules on the left, one view at a time on the right; phone: modules become a scrolling pill row. Liquid glass over a slow light field. */
:root{
  --bg:#e9edf5; --fg:#0c1322; --muted:#5a6477; --faint:#8a93a6;
  --accent:#0a7cff; --accent-soft:rgba(10,124,255,.13);
  --good:#1a9e4b; --warn:#d97800; --bad:#e0352b;
  --good-soft:rgba(26,158,75,.13); --warn-soft:rgba(217,120,0,.14); --bad-soft:rgba(224,53,43,.12);
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78); --stroke:rgba(255,255,255,.85);
  --hair:rgba(18,28,48,.09); --sheen:rgba(255,255,255,.75); --shadow:rgba(30,45,80,.14);
  --bar:rgba(60,72,96,.2);
  --a1:#5e5ce6; --a2:#af52de; --a3:#ff9f0a; --a4:#0a7cff; --a5:#30b158; --a6:#30b0c7; --a7:#ff375f;
  --blob1:#7fb2ff; --blob2:#ffc785; --blob3:#6fe0cf; --blob4:#c3a6ff;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Onest",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Onest",system-ui,sans-serif;
  --f-mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --r-xl:28px; --r-lg:20px; --r-md:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#05070c; --fg:#f1f4fa; --muted:#98a2b5; --faint:#6b7488; --accent:#3d9bff; --accent-soft:rgba(61,155,255,.17);
  --good:#34d26a; --warn:#ffac33; --bad:#ff5a4f; --good-soft:rgba(52,210,106,.14); --warn-soft:rgba(255,172,51,.15); --bad-soft:rgba(255,90,79,.15);
  --glass:rgba(30,35,48,.48); --glass-strong:rgba(38,44,60,.74); --stroke:rgba(255,255,255,.13);
  --hair:rgba(255,255,255,.08); --sheen:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.5); --bar:rgba(200,210,230,.2);
  --blob1:#1f4fb3; --blob2:#7a4410; --blob3:#0f6b62; --blob4:#4a2f9a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05070c; --fg:#f1f4fa; --muted:#98a2b5; --faint:#6b7488; --accent:#3d9bff; --accent-soft:rgba(61,155,255,.17);
  --good:#34d26a; --warn:#ffac33; --bad:#ff5a4f; --good-soft:rgba(52,210,106,.14); --warn-soft:rgba(255,172,51,.15); --bad-soft:rgba(255,90,79,.15);
  --glass:rgba(30,35,48,.48); --glass-strong:rgba(38,44,60,.74); --stroke:rgba(255,255,255,.13);
  --hair:rgba(255,255,255,.08); --sheen:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.5); --bar:rgba(200,210,230,.2);
  --blob1:#1f4fb3; --blob2:#7a4410; --blob3:#0f6b62; --blob4:#4a2f9a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.scene span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7;animation:drift 28s ease-in-out infinite alternate}
.scene .b1{width:50vmax;height:50vmax;left:-14vmax;top:-18vmax;background:var(--blob1)}
.scene .b2{width:38vmax;height:38vmax;right:-10vmax;top:6vmax;background:var(--blob2);animation-delay:-8s}
.scene .b3{width:44vmax;height:44vmax;left:24vmax;bottom:-24vmax;background:var(--blob3);animation-delay:-14s}
.scene .b4{width:28vmax;height:28vmax;right:16vmax;bottom:4vmax;background:var(--blob4);animation-delay:-4s;opacity:.5}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}

.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--stroke);border-radius:var(--r-xl);box-shadow:inset 0 1px 0 var(--sheen),0 16px 36px -18px var(--shadow)}
.card{background:var(--glass-strong);border:1px solid var(--hair);border-radius:var(--r-lg);padding:16px;min-width:0}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);gap:18px;max-width:1440px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 48px;min-height:100%}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);align-self:start;max-height:calc(100vh - 28px);overflow:auto;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 14px}
.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--a6));color:#fff;font:800 13px/1 var(--f-display);font-style:normal}
.logo b{font-family:var(--f-display);font-size:15px;display:block;line-height:1.15}
.logo span{font-size:11.5px;color:var(--muted)}
.grp{font:600 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:500;font-size:14px;color:var(--fg)}
.nav:hover{background:var(--hair)}
.nav[aria-current="page"]{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--sheen),0 4px 14px -6px var(--shadow);font-weight:650}
.nav .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;color:#fff}
.nav .ct{margin-left:auto;font:600 11px/1 var(--f-mono);color:var(--muted)}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px}
.top .crumb{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask{flex:1;display:flex;align-items:center;gap:8px;min-width:0;background:var(--hair);border-radius:999px;padding:8px 14px;color:var(--muted);font-size:13.5px;border:0;cursor:pointer;text-align:left}
.live{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);padding:8px 12px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.demo{font:600 11px/1 var(--f-body);padding:8px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;flex-direction:row;overflow-x:auto;max-height:none;padding:8px;border-radius:var(--r-lg);gap:4px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .logo,.grp{display:none}
  #navList{display:flex;gap:4px}
  .nav{white-space:nowrap;width:auto;padding:8px 12px}
  .nav .ct{display:none}
  .top{position:static;border-radius:var(--r-lg);flex-wrap:wrap}
  .ask{order:3;flex-basis:100%}
}

/* view basics */
.view{display:flex;flex-direction:column;gap:16px;min-width:0}
.vh{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
.eyebrow{font:600 11.5px/1 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,46px);line-height:1.04;letter-spacing:-.03em;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--a6));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:650;font-size:15.5px;margin:0}
.lede{margin:0;color:var(--muted);max-width:72ch;font-size:15px}
.pad{padding:20px}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h p{margin:0;color:var(--muted);font-size:13.5px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.g21{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr}}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--good)}.dn{color:var(--bad)}.wn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--hair);white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.r{background:var(--bad-soft);color:var(--bad)}.pill.b{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--hair)}
.li:last-child{border-bottom:0}
.li .t{font-size:13.5px;min-width:0;flex:1}
.li .t b{font-weight:650}
.li .tm{font:600 11.5px/1.4 var(--f-mono);color:var(--muted);flex:none;min-width:40px}
.av{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 10.5px/1 var(--f-display);color:#fff;flex:none}
.tbl{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--hair)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap;font-weight:600;text-align:right}
.btn{border:1px solid var(--stroke);background:var(--glass-strong);padding:8px 13px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:var(--hair)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--hair);background:var(--glass);padding:8px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bar-t{height:8px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
svg text{font-family:var(--f-body)}

/* tour: layers */
.layers{display:flex;flex-direction:column;gap:10px}
.layer{display:grid;grid-template-columns:180px minmax(0,1fr);gap:16px;align-items:center;padding:14px 16px;border-radius:var(--r-lg);background:var(--glass-strong);border:1px solid var(--hair);position:relative}
.layer .ln b{display:block;font-family:var(--f-display);font-size:15px}
.layer .ln span{font-size:12px;color:var(--muted)}
.layer .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);white-space:nowrap}
.layer.top1{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--glass-strong))}
.flowcol{display:flex;justify-content:space-between;padding:0 24px;color:var(--muted);font-size:12px}
.updown{display:flex;justify-content:center;gap:28px;font-size:12px;color:var(--muted)}
.updown span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:700px){.layer{grid-template-columns:1fr}}
.stops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.stops{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stop{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;border:1px solid var(--hair);background:var(--glass-strong);border-radius:var(--r-lg);padding:14px;transition:transform .18s ease-out}
.stop:hover{transform:translateY(-2px);border-color:var(--accent)}
.stop .k{font:700 11px/1 var(--f-mono);color:var(--accent)}
.stop b{font-family:var(--f-display);font-size:14.5px}
.stop span{font-size:12.5px;color:var(--muted)}
.ab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.ab{grid-template-columns:1fr}}
.ab .card h3{margin-bottom:8px}
.ab ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}

/* pyramid */
.pyr-wrap{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:stretch}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.tier{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 18px;border-radius:16px;border:1px solid var(--hair);min-width:0}
.tier .th b{display:block;font-family:var(--f-display);font-size:16px;letter-spacing:-.01em}
.tier .th span{font-size:12px;opacity:.75}
.tier .tc{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.tier .tc i{font-style:normal;font-size:12px;padding:5px 9px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--hair);white-space:nowrap}
.tier.t1{width:40%;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--a1)));color:#fff;border-color:transparent;box-shadow:0 14px 30px -14px var(--accent)}
.tier.t1 .tc i{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff}
.tier.t2{width:56%;background:color-mix(in srgb,var(--accent) 20%,var(--glass-strong))}
.tier.t3{width:70%;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 14%,var(--glass-strong)),color-mix(in srgb,var(--a6) 18%,var(--glass-strong)));border-color:color-mix(in srgb,var(--a6) 40%,transparent)}
.tier.t4{width:85%;background:color-mix(in srgb,var(--a6) 10%,var(--glass-strong))}
.tier.t5{width:100%;background:var(--glass-strong)}
.pyr-arrow{position:relative;display:flex;justify-content:center}
.pyr-arrow::before{content:"";position:absolute;top:12px;bottom:12px;left:50%;width:2px;transform:translateX(-50%);border-radius:2px}
.pyr-arrow.up::before{background:linear-gradient(to top,var(--a6),var(--accent))}
.pyr-arrow.down::before{background:linear-gradient(to bottom,var(--accent),var(--a1))}
.pyr-arrow::after{content:"";position:absolute;left:50%;width:12px;height:12px;border-left:2px solid;border-top:2px solid;transform:translateX(-50%) rotate(45deg)}
.pyr-arrow.up::after{top:12px;color:var(--accent)}
.pyr-arrow.down::after{bottom:12px;color:var(--a1);transform:translateX(-50%) rotate(225deg)}
.pyr-arrow span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);padding:8px 0;border-radius:99px;position:relative;z-index:1;align-self:center}
.pyr-arrow.down span{transform:none}
@media (max-width:860px){.tier.t1{width:62%}.tier.t2{width:72%}.tier.t3{width:82%}.tier.t4{width:92%}}
@media (max-width:600px){.pyr-wrap{grid-template-columns:14px minmax(0,1fr) 14px;gap:4px}.pyr-arrow span{display:none}.tier{padding:12px 10px}.tier.t1{width:82%}.tier.t2{width:88%}.tier.t3{width:94%}.tier.t4{width:98%}.tier .tc i{white-space:normal}}

/* systematization */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end}
.step-l{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r-md);background:var(--glass-strong);border:1px solid var(--hair);min-height:calc(var(--h) + 96px);justify-content:flex-end}
.step-l .lv{font:800 26px/1 var(--f-display);color:var(--faint)}
.step-l b{font-family:var(--f-display);font-size:15px}
.step-l span:not(.lv){font-size:12.5px;color:var(--muted)}
.step-l.now{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--glass-strong))}
.step-l.now .lv{color:var(--warn)}
.step-l.goal{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--glass-strong))}
.step-l.goal .lv{color:var(--accent)}
.flag{position:absolute;top:10px;right:10px;font:600 10.5px/1 var(--f-body);font-style:normal;padding:5px 7px;border-radius:999px;background:var(--warn);color:#fff}
.flag.g{background:var(--accent)}
@media (max-width:860px){.ladder{grid-template-columns:minmax(0,1fr)}.step-l{min-height:0}.flag{position:static;align-self:flex-start;margin-top:4px}}
.sysb{display:flex;flex-direction:column;gap:8px}
.sysb .no{font:700 11px/1 var(--f-mono);color:var(--accent)}
.sysb p{margin:0;font-size:13px;color:var(--muted)}
.okc{font-size:12.5px;padding:9px 11px;border-radius:12px;background:var(--good-soft)}
.okc b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin-bottom:2px}
.sysb .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.chk{cursor:pointer;align-items:center}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0}
.chk input:checked ~ .t{text-decoration:line-through;color:var(--muted)}

/* founder */
.brief{display:flex;gap:12px;align-items:flex-start}
.brief .av{width:38px;height:38px;border-radius:12px;font-size:12px}
.brief p{margin:0;font-size:14px}
.dec{display:flex;flex-direction:column;gap:10px}
.decision{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;padding:14px;border-radius:var(--r-md);background:var(--glass-strong);border:1px solid var(--hair)}
.decision.done{opacity:.55}
.decision b{font-family:var(--f-display);font-size:14.5px;display:block}
.decision p{margin:4px 0 0;font-size:12.8px;color:var(--muted)}
.decision .eff{font-size:12.5px;font-weight:650;margin-top:6px}
.decision .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.decision{grid-template-columns:1fr}.decision .acts{justify-content:flex-start}}
.phone{width:300px;max-width:100%;margin:0 auto;border-radius:44px;padding:12px;background:#0b0d12;box-shadow:0 30px 60px -24px var(--shadow),inset 0 0 0 2px #2a2f3a}
.screen{border-radius:34px;overflow:hidden;background:var(--bg);min-height:560px;display:flex;flex-direction:column;gap:10px;padding:16px 12px}
.notch{width:96px;height:26px;border-radius:99px;background:#0b0d12;margin:-6px auto 4px}

(function(){

const fmt = (v, d = 0) => Number(v).toLocaleString('ru-RU', {maximumFractionDigits: d, minimumFractionDigits: d});

/* ---------- data: agents ---------- */
const DEPT = [

  {id:'fin', n:'Финансы', who:'финдиректор, 2 бухгалтера', c:'var(--a5)', ic:'F', agents:[['cash','Казначей','касса и платёжный календарь на 8 недель',2],['ar','Дебиторка','кто должен, сколько и кому звонить первым',2],['acc','AI-бухгалтер','счета, акты сверки, ЭСФ',2],['sku','Маржа по продуктам','себестоимость и маржа по каждому SKU и клиенту',2]]},

const AG = {}; DEPT.forEach(d => d.agents.forEach(a => AG[a[0]] = {id:a[0], n:a[1], d:a[2], ph:a[3], dept:d.n, c:d.c}));

/* ---------- views registry ---------- */
const VIEWS = [
  {id:'tour', n:'Экскурсия', ic:'★', c:'var(--a4)', g:'Старт'},
  {id:'founder', n:'Основатель', ic:'◎', c:'var(--a1)', g:'Верх: управление', ct:'5'},

let lastG = '';
$('#navList').innerHTML = VIEWS.map(v => { const g = v.g !== lastG ? `<div class="grp">${v.g}</div>` : ''; lastG = v.g;
  return g + `<button class="nav" type="button" data-v="${v.id}"><span class="ic" style="background:${v.c}">${v.ic}</span>${v.n}${v.ct ? `<span class="ct">${v.ct}</span>` : ''}</button>`; }).join('');

/* ---------- helpers ---------- */
const kpi = (l, v, u, d, cls) => `<div class="card kpi"><span class="l">${l}</span><span class="v">${v}${u ? `<small>${u}</small>` : ''}</span>${d ? `<span class="d ${cls || 'up'}">${d}</span>` : ''}</div>`;
const agentChip = id => { const a = AG[id]; return `<button type="button" class="agent" data-agent="${id}"><i style="background:${a.c}">${a.n.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()}</i><div><b>${a.n}</b><span>${a.d}</span></div><span class="ph">этап ${a.ph}</span></button>`; };
function spark(vals, h = 46, color = 'var(--accent)'){
  const w = 220, mx = Math.max(...vals), mn = Math.min(...vals), sx = w / (vals.length - 1);
  const pts = vals.map((v, i) => [i * sx, h - 6 - (v - mn) / (mx - mn || 1) * (h - 12)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w} ${h}L0 ${h}Z" fill="${color}" fill-opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/></svg>`;
}
function bars(rows, opt = {}){
  const w = 640, h = opt.h || 200, pad = 34, max = opt.max || Math.max(...rows.map(r => Math.max(r.v, r.p || 0))) * 1.12;

/* ---------- routing ---------- */
function go(id, push){
  if (!VIEWS.find(v => v.id === id)) id = 'tour';
  VIEWS.forEach(v => $('#v-' + v.id).hidden = v.id !== id);
  document.querySelectorAll('.nav').forEach(b => b.setAttribute('aria-current', b.dataset.v === id ? 'page' : 'false'));
  $('#crumb').textContent = VIEWS.find(v => v.id === id).n;
  if (push !== false) { try { history.replaceState(null, '', '#' + id); } catch (e) {} }
  const nb = document.querySelector(`.nav[data-v="${id}"]`); if (nb && innerWidth <= 960) nb.scrollIntoView({inline:'center', block:'nearest'});
}
window.__go = go;
document.addEventListener('click', e => { const n = e.target.closest('.nav'); if (n) { go(n.dataset.v); scrollTo({top:0, behavior: RM ? 'auto' : 'smooth'}); } const s = e.target.closest('[data-go]'); if (s) { go(s.dataset.go); scrollTo({top:0, behavior: RM ? 'auto' : 'smooth'}); } });

go(location.hash.slice(1) || 'tour', false);
